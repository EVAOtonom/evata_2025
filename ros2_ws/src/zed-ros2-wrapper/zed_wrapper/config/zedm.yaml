# config/zedm.yaml

/**:
  ros__parameters:
    general:
      camera_model: 'zedm'
      camera_name: 'zedm'
      grab_resolution: 'HD720'       # 'HD720' en dengeli çözünürlük: kalite + FPS uyumu
      grab_frame_rate: 15            # Daha az CPU kullanımı, derinlik için yeterli

    depth:
      min_depth: 0.3                 # çok yakın nesnelerde titremeyi önler
      max_depth: 10.0                # daha fazlası genelde gürültülü olur

    positional_tracking:
      enabled: true                  # kamera sabitse bile aktif olmalı
      publish_tf: true               # TF bağlantısı gerekiyorsa
      path_pub_rate: 1.0             # 1 Hz önerilir
      imu_fusion: true               # ZEDm’de IMU olduğu için bu önemli

    spatial_mapping:
      mapping_enabled: false         # sadece 3D map yapılacaksa açılır
      resolution: 0.05
      range: 3.5

    point_cloud:
      pc_topic_freq: 15.0            # FPS ile aynı olmalı
      resolution: 1.0                # 1.0 = tüm noktalar, gerekirse 0.5 deneyebilirsin
      confidence: 80                 # 80-95 arası iyidir, daha düşük olursa daha gürültülü olur
